<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>สำหรับเจ้าหน้าที่ | สสจ.นครปฐม</title><link rel="stylesheet" href="styles.css?v=20261029-readable-r11"><script defer src="config.js?v=20261027-drive-r7"></script><script defer src="app.js?v=20261029-readable-r11"></script><script defer src="staff.js?v=20261027-forms-r5"></script><script src="https://accounts.google.com/gsi/client" async defer></script></head><body data-staff="true"><div class="top"><span>ระบบจัดการเว็บไซต์และเรื่องร้องเรียน</span><div id="identity">ยังไม่ได้เข้าสู่ระบบ</div><button id="login">เข้าสู่ระบบด้วย Google</button><button id="logout" class="hidden">ออกจากระบบ</button></div><header><a class="brand" href="index.html">✚ กลุ่มงานคุ้มครองผู้บริโภคและเภสัชสาธารณสุข</a><a href="index.html">กลับหน้าประชาชน ↗</a></header><main><section id="staffGate" class="panel"><h1>สำหรับเจ้าหน้าที่</h1><p>เข้าสู่ระบบด้วยบัญชี Google ที่ได้รับสิทธิ์จากผู้ดูแล</p><button class="login-button">เข้าสู่ระบบด้วย Google</button></section><section id="workspace" class="hidden"><nav class="workspace-tabs"><button data-tab="cases">เรื่องร้องเรียน</button><button data-tab="banner">แบนเนอร์</button><button data-tab="news">ข่าวประชาสัมพันธ์</button><button data-tab="alert">ข่าวเตือนภัย</button><button data-tab="permissions">สิทธิ์เจ้าหน้าที่</button><button data-tab="settings">ข้อมูลเว็บไซต์</button></nav><section id="casesPanel" class="panel"><h2>เรื่องร้องเรียน</h2><label>เลือกหมวดที่รับผิดชอบก่อนแสดงข้อมูล<select id="staffCategory"><option value="">— เลือกหมวด —</option></select></label><div class="toolbar"><input id="staffSearch" placeholder="ค้นหาเลขรับเรื่องหรือหัวข้อ" aria-label="ค้นหาเรื่อง"><button id="findCases">ค้นหา</button></div><div id="staffCases"></div><button id="moreCases" class="hidden">โหลดเพิ่ม</button></section><section id="contentPanel" class="panel hidden"><h2 id="contentHeading"></h2><button id="newContent">เพิ่มรายการ</button><div id="contentList"></div><form id="contentForm" class="hidden"><input name="id" type="hidden"><label>หัวข้อ *<input name="title" maxlength="200" required></label><label>เนื้อหา<textarea name="body" maxlength="15000" rows="6"></textarea></label><div class="grid"><label>ลิงก์ภายนอก (ถ้ามี)<input name="link" type="url" placeholder="https://..."></label><label>ลำดับแสดง<input name="sort" type="number" min="0" max="9999" value="0"></label></div><label>รูปภาพหรือไฟล์ประกอบ<input name="file" type="file" accept="image/jpeg,image/png,application/pdf"><small>แบนเนอร์ใช้ JPG/PNG ข่าวและเตือนภัยแนบ JPG/PNG/PDF ได้ ไม่เกิน 5 MB</small></label><label class="check"><input name="published" type="checkbox"> เผยแพร่บนเว็บไซต์</label><p><button>บันทึก</button><button id="cancelContent" type="button">ยกเลิก</button></p></form></section><section id="permissionPanel" class="panel hidden"><h2>สิทธิ์เจ้าหน้าที่</h2><div id="staffAccounts"></div><form id="permissionForm"><label>อีเมลบัญชี Google<input name="email" type="email" required></label><label>ชื่อแสดง<input name="displayName" maxlength="120" required></label><p><button type="button" id="selectAll">เลือกทั้งหมด</button><button type="button" id="clearAll">ล้างทั้งหมด</button></p><div id="permissionMatrix" class="table-wrap"></div><label class="check"><input name="active" type="checkbox" checked> เปิดใช้งานบัญชีเจ้าหน้าที่</label><p><button>บันทึกสิทธิ์</button></p></form></section><section id="settingsPanel" class="panel hidden"><h2>ข้อมูลเว็บไซต์</h2><form id="settingsForm"><label>ช่องทางติดต่อ<textarea name="contact" maxlength="1000"></textarea></label><label>ประกาศความเป็นส่วนตัวและช่องทางใช้สิทธิ<textarea name="privacyText" maxlength="5000" rows="6"></textarea></label><button>บันทึกข้อมูล</button></form></section></section><output id="staffMessage" aria-live="polite"></output></main><dialog id="staffCaseDialog"><button class="close-dialog">ปิด</button><h2 id="staffCaseTitle"></h2><pre id="staffCaseInfo"></pre><div id="evidence"></div><div id="staffHistory"></div><form id="replyForm"><input name="id" type="hidden"><input name="requestId" type="hidden"><label>สถานะ<select name="status"><option>รับเรื่องแล้ว</option><option>กำลังตรวจสอบ</option><option>ประสานหน่วยงาน</option><option>ยุติเรื่อง</option></select></label><label>ข้อความแจ้งผู้ร้อง *<textarea name="note" maxlength="3000" required></textarea></label><label>บันทึกภายใน<textarea name="internal" maxlength="3000"></textarea></label><label>ชื่อลิงก์ตอบกลับ (ถ้ามี)<input name="linkTitle" maxlength="200"></label><label>URL ลิงก์ตอบกลับ<input name="linkUrl" type="url" placeholder="https://..."></label><label>รูปภาพหรือเอกสารตอบกลับ<input name="files" type="file" multiple accept="image/jpeg,image/png,application/pdf"><small>3 ไฟล์ ไฟล์ละไม่เกิน 5 MB</small></label><button>บันทึกและแจ้งผล</button></form></dialog><div id="toast" role="status"></div><iframe id="bridge" class="service-frame" title="ช่องทางเชื่อมต่อบริการ" referrerpolicy="no-referrer"></iframe></body></html>
